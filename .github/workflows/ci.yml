name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Pull requests: every commit in the PR. Pushes: the commits in the push.
      # Commits before Conventional Commits were adopted (up to 1da1f3f) are skipped.
      - name: Lint commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE=1da1f3f37548f93f245044379ba587c0c2dae1e8
          fi
          npx commitlint --from "$BASE" --to "$HEAD" --verbose

  check:
    name: Typecheck and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # Catches anything Metro cannot bundle for Android (bad imports, Node-only modules) without a device.
      - name: Bundle Android app
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/expo-export"
        env:
          CI: 1

  # A test APK for each pull request, under the run's Artifacts. It is signed with a debug key,
  # so uninstall a release build before installing it.
  apk:
    name: Test APK
    if: github.event_name == 'pull_request'
    needs: check
    uses: ./.github/workflows/android-apk.yml
    with:
      apk-name: hat-trick-pr${{ github.event.pull_request.number }}.apk
