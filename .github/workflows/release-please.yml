name: Release

# Keeps a release PR open with the next version and CHANGELOG, based on
# Conventional Commits since the last release. Merging it creates a DRAFT GitHub Release
# (vX.Y.Z), the apk job builds a signed APK from the release commit, and only once the APK is
# attached does the publish job publish the release (which also creates the tag). Users never see a
# release without its APK, and a failed APK build leaves the draft unpublished.
#
# The release PR is opened by a separate last job, after the tag exists. If it were opened in the
# same run that creates a draft release, release-please could not find the new tag, would treat the
# whole history as unreleased and open a bogus PR (it once proposed "1.0.0" right after 1.2.0).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Only create releases here. The release PR is handled by the release-pr job below.
          skip-github-pull-request: true

  apk:
    name: Build release APK
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/android-apk.yml
    with:
      # A draft release has no tag yet, so build from the release commit itself.
      ref: ${{ needs.release-please.outputs.sha }}
      apk-name: hat-trick-${{ needs.release-please.outputs.tag_name }}.apk
      release-signing: true
      # Also 32-bit ARM, for older phones. PR test builds are 64-bit ARM only, to build faster.
      architectures: arm64-v8a,armeabi-v7a
      retention-days: 7
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  publish:
    name: Attach APK and publish the release
    needs: [release-please, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: hat-trick-${{ needs.release-please.outputs.tag_name }}.apk
      - name: Upload to the draft release, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" "hat-trick-$TAG.apk" --clobber
          gh release edit "$TAG" --draft=false

  release-pr:
    name: Open or update the release PR
    needs: [release-please, apk, publish]
    # Runs on every push to main: right after publish when a release was made, or directly when the
    # apk and publish jobs were skipped. Not when the APK build or publish failed (the draft is
    # still waiting, and the tag does not exist yet).
    if: ${{ !cancelled() && needs.release-please.result == 'success' && needs.apk.result != 'failure' && needs.publish.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
